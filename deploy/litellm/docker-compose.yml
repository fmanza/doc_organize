# Despliegue local de un LiteLLM Proxy para doc_organize (Sub-fase B: clasificación
# de dominios por IA, `doc_organize.ai.DomainClassificationClient`).
# Guía completa: ../../docs/guides/litellm_proxy_setup.md
#
# Uso:
#   cp .env.example .env
#   cp config.yaml.example config.yaml   # adaptar model_list a tu proveedor real
#   # rellenar .env y config.yaml con tus propios valores
#   docker compose up -d
#
# NUNCA versionar .env ni config.yaml reales (ver .gitignore de la raíz del
# repo) — solo los .example de esta carpeta.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  litellm_postgres_data:
