[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: tests unitarios rapidos (< 100ms por test objetivo)
    integration: tests de integracion/e2e con componentes reales
    contract: tests de contrato de API/comportamiento
    slow: tests lentos (> 1s)
    async: tests asincronos
    cross_db: tests de compatibilidad entre motores
    e2e: tests end-to-end
    sqlite: tests especificos de sqlite
    postgresql: tests especificos de postgresql
    service: tests de servicio
    flaky: tests inestables en investigacion
addopts =
    -q
    --strict-markers
    --tb=short
    --disable-warnings
    -v
