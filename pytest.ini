[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: tests unitarios rapidos (< 100ms por test objetivo)
    integration: tests de integracion/e2e con componentes reales
    contract: tests de contrato de API/comportamiento
    slow: tests lentos (> 1s)
    sqlite: tests especificos del backend SQLite (cache/)
    flaky: tests inestables en investigacion
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
