[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_organize"
version = "0.9.3"
description = "Sistema de extracción de contenido de documentos en Markdown y JSON documentación y organización."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com"}]
license = {text = "MIT"}
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "docling[rapidocr]>=2.0.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "aiosqlite>=0.19",
    "pillow>=10.0",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "python-magic>=0.4; sys_platform != 'win32'",
    "python-magic-bin>=0.4; sys_platform == 'win32'",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/fmanza/doc_organize"
Documentation = "https://fmanza.github.io/doc_organize"
Repository = "https://github.com/fmanza/doc_organize.git"
Issues = "https://github.com/fmanza/doc_organize/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    # ruff 0.16 amplía las reglas por defecto (DTZ, RUF, SIM) y el CI, que instala la última, falla con 11
    # avisos nuevos; se fija por debajo hasta revisarlos (deuda registrada en el CHANGELOG 0.9.3).
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0",
    "types-aiofiles>=23.0",
    "types-PyYAML>=6.0",
    "black>=23.0",
    # Web dependencies for type checking and testing (have native type hints)
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "starlette>=0.35",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "cryptography>=41.0",  # auth/secrets_cipher.py (extra web); sin él mypy y los tests fallan en el CI
    # Test PDF generation fixtures (matplotlib used to create native PDFs)
    "matplotlib>=3.5",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1",
    # Cifrado en reposo de credenciales de IA guardadas desde el panel de
    # configuración (auth/secrets_cipher.py, Fernet) -- auditoría de parametrización,
    # 2026-09-10.
    "cryptography>=41.0",
]
ocr-gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.8",
    "easyocr>=1.7",
]
av = [
    "docling[asr]>=2.0.0",
]
ai = [
    "httpx>=0.24",
]
context = [
    "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = false
ignore_missing_imports = false

# Docling arrastra dependencias (via scipy-stubs) que usan sintaxis de
# Python 3.12+ en sus stubs; no seguimos sus imports para que no rompan el
# type-check de nuestro propio codigo (que sigue siendo compatible con 3.11+).
# pandas no publica tipos (pandas-stubs es aparte) y solo lo usa web/routes/downloads.py, que se retira con web/.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docling.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["doc_organize"]
combine-as-imports = true
force-single-line = false
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# UP042 sugiere `enum.StrEnum` (3.11+) en vez de `class X(str, Enum)` para los 6
# enums de este módulo. No es un cambio cosmético: `str(member)`/f-string sobre
# un `StrEnum` devuelve el valor ("red"), mientras que sobre `(str, Enum)`
# devuelve "Clase.MIEMBRO" -- observable por cualquier log/f-string existente
# sobre estos enums. Ruff lo marca como "unsafe fix" por esta misma razón;
# decisión deliberada de no aplicarlo sin una revisión propia (maturity-assessment,
# sesión 2026-09-03) -- no una omisión.
"src/doc_organize/core/models.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
