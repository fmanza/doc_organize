[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_organize"
version = "0.1.0"
description = "Sistema de extracción de contenido de documentos en Markdown y JSON documentación y organización."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com"}]
license = {text = "MIT"}
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "docling[rapidocr]>=2.0.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "aiosqlite>=0.19",
    "pillow>=10.0",
    "pandas>=2.0",
    "python-magic>=0.4; sys_platform != 'win32'",
    "python-magic-bin>=0.4; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/user/doc_organize"
Documentation = "https://user.github.io/doc_organize"
Repository = "https://github.com/user/doc_organize.git"
Issues = "https://github.com/user/doc_organize/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-aiofiles>=23.0",
    "black>=23.0",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1",
]
ocr-gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = false

# Docling arrastra dependencias (via scipy-stubs) que usan sintaxis de
# Python 3.12+ en sus stubs; no seguimos sus imports para que no rompan el
# type-check de nuestro propio codigo (que sigue siendo compatible con 3.10).
[[tool.mypy.overrides]]
module = ["docling.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["doc_organize"]
combine-as-imports = true
force-single-line = false
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
