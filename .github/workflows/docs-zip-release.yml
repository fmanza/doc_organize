name: 📦 Build & Publish Docs ZIP

on:
  push:
    branches:
      - main
      - develop
    # Solo si hay cambios en docs/
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-zip-release.yml'
  workflow_dispatch:  # Ejecutar manualmente desde GitHub UI

jobs:
  build-and-publish:
    name: Build Docs & Publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para crear releases

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: '🐍 Set up Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: '📦 Install dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: '🏗️ Build documentation (MkDocs)'
        run: |
          mkdocs build --strict
          echo "✅ Documentation built successfully"

      # NOTE: Offline ZIP release feature is planned for future implementation
      # see .ai/DECISIONS_LOG.md (revision 12). Currently disabled pending scripts/build_docs_zip.py.
      # For now, docs are built and published to GitHub Pages automatically.
      #
      # Future steps (currently disabled):
      # - name: '📚 Generate ZIP + Checksums'
      #   run: |
      #     python scripts/build_docs_zip.py --builder mkdocs
      #     echo "✅ ZIP and checksums generated"
      #     ls -lh dist/
      #
      # - name: '🔐 Display checksums for verification'
      # - name: '📤 Upload ZIP as artifact (retention: 30 days)'
      # - name: '📋 Extract version and prepare release'
      # - name: '🏷️ Create or update GitHub Release'
      #
      # See docs for offline access: https://fmanza.github.io/doc_organize/guides/quick_start/

      - name: '✅ Documentation build completed successfully'
        run: |
          echo "🎉 Documentation built successfully and ready for deployment"
          echo "📖 Docs location: site/"
          echo "🔗 Published at: https://fmanza.github.io/doc_organize/"
          ls -lh site/

      - name: '📢 Notify on failure'
        if: failure()
        run: |
          echo "❌ Build failed. Check the logs above."
          exit 1
