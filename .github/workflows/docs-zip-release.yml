name: 📦 Build & Publish Docs ZIP

on:
  push:
    branches:
      - main
      - develop
    # Solo si hay cambios en docs/
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-zip-release.yml'
  workflow_dispatch:  # Ejecutar manualmente desde GitHub UI

jobs:
  build-and-publish:
    name: Build Docs & Publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para crear releases

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: '🐍 Set up Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: '📦 Install dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: '🏗️ Build documentation (MkDocs)'
        run: |
          mkdocs build --strict
          echo "✅ Documentation built successfully"

      - name: '📚 Generate ZIP + Checksums'
        run: |
          python scripts/build_docs_zip.py --builder mkdocs
          echo "✅ ZIP and checksums generated"
          ls -lh dist/

      - name: '🔐 Display checksums for verification'
        run: |
          echo "📋 CHECKSUMS.txt content:"
          cat dist/CHECKSUMS.txt || echo "No checksums file yet"
          echo ""
          echo "🔒 SHA256 file:"
          cat dist/*.sha256 || echo "No sha256 file yet"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-zip-build
          path: dist/doc_organize-docs-*.zip*
          retention-days: 30

      - name: '📋 Extract version and prepare release'
        id: release_info
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

          # Get SHA256
          SHA256=$(cat dist/*.sha256 | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "🔐 SHA256: $SHA256"

      - name: '🏷️ Create or update GitHub Release'
        uses: ncipollo/release-action@v1
        with:
          tag: docs-v${{ steps.release_info.outputs.version }}
          name: 📚 Documentation Offline v${{ steps.release_info.outputs.version }}
          body: |
            ## 📚 Documentation Offline Package

            **Version**: ${{ steps.release_info.outputs.version }}
            **Date**: ${{ github.event.head_commit.timestamp }}
            **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### 📦 Contents

            - ✅ Complete HTML documentation with search
            - ✅ Mermaid diagrams (rendered)
            - ✅ Code examples and API reference
            - ✅ Offline search capability
            - ✅ Responsive design (mobile-friendly)

            ### 🔐 Integrity Verification

            **SHA256**: `${{ steps.release_info.outputs.sha256 }}`

            To verify the download integrity:
            ```bash
            sha256sum doc_organize-docs-*.zip
            # Compare the output with the SHA256 above
            ```

            ### 🚀 How to Use

            1. Download the ZIP file below
            2. Extract: `unzip doc_organize-docs-*.zip`
            3. Open `index.html` in your browser
            4. Use the search function for offline access

            ### 📖 Related Links

            - 🌐 [Online Documentation](https://fmanza.github.io/doc_organize/)
            - 📦 [PyPI Package](https://pypi.org/project/doc-organize/)
            - 💻 [Source Code](https://github.com/fmanza/doc_organize)
            - 📋 [Downloads Page](https://fmanza.github.io/doc_organize/downloads)
          artifacts: dist/doc_organize-docs-*.zip,dist/*.sha256,dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true

      - name: '✅ Release published successfully'
        run: |
          echo "🎉 Release created/updated: docs-v${{ steps.release_info.outputs.version }}"
          echo "📥 Download: https://github.com/fmanza/doc_organize/releases/tag/docs-v${{ steps.release_info.outputs.version }}"

      - name: '📢 Notify on failure'
        if: failure()
        run: |
          echo "❌ Build failed. Check the logs above."
          exit 1
