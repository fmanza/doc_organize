<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}doc_organize{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.4rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
        form { margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        input[type=text], input[type=password] { padding: 0.4rem; flex: 1; min-width: 200px; }
        button { padding: 0.4rem 0.8rem; cursor: pointer; }
        .missing { color: #b00; font-size: 0.85em; }
        .error { color: #b00; margin: 0.5rem 0; min-height: 1.2em; }
        a { color: #06c; }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        nav.session-nav { text-align: right; font-size: 0.85em; margin-bottom: 0.5rem; }
        nav.session-nav button.link { all: unset; cursor: pointer; color: #06c; }
    </style>
</head>
<body>
    {% if request.state.user_id is defined %}
    <nav class="session-nav">
        {% if request.state.is_admin %}<a href="/admin/users">Gestión de usuarios</a> ·{% endif %}
        <form method="post" action="/logout" style="display:inline;"><button type="submit" class="link">Cerrar sesión</button></form>
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
