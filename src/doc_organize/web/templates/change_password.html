{% extends "base.html" %}
{% block title %}doc_organize — Cambiar contraseña{% endblock %}
{% block content %}
<h1>Cambiar contraseña</h1>
<p>Debes elegir una contraseña nueva antes de continuar.</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/change-password" style="flex-direction: column; align-items: stretch;">
    <label for="current_password" class="sr-only">Contraseña actual</label>
    <input type="password" id="current_password" name="current_password" placeholder="Contraseña actual" required autofocus>
    <label for="new_password" class="sr-only">Contraseña nueva</label>
    <input type="password" id="new_password" name="new_password" placeholder="Contraseña nueva" required>
    <label for="confirm_password" class="sr-only">Confirmar contraseña nueva</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar contraseña nueva" required>
    <button type="submit">Cambiar contraseña</button>
</form>
{% endblock %}
