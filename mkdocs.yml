site_name: doc_organize
site_description: Sistema de extracción de contenido de documentos en Markdown y JSON documentación y organización.
site_author: Paco Manzano
site_url: https://user.github.io/doc_organize

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

nav:
  - Inicio: index.md
  - Guías:
      - Instalación: guides/installation.md
      - Inicio rápido: guides/quick_start.md
      - Resolución de problemas: guides/troubleshooting.md
  - Funcionalidad: functional/index.md
  - API:
      - Arquitectura y referencia: api/index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
