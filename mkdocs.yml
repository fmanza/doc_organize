site_name: doc_organize
site_description: Sistema de extracción de contenido de documentos en Markdown y JSON documentación y organización.
site_author: Paco Manzano
site_url: https://user.github.io/doc_organize

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

nav:
  - Inicio: index.md
  - Guías:
      - Instalación: guides/installation.md
      - Inicio rápido: guides/quick_start.md
      - Resolución de problemas: guides/troubleshooting.md
      - Descarga Offline: guides/downloads.md
      - Desplegar un LiteLLM Proxy: guides/litellm_proxy_setup.md
  - Funcionalidad:
      - Descripción general: functional/index.md
      - Validadores: functional/validators.md
      - Scanner: functional/scanner.md
      - Converter: functional/converter.md
      - Deduplicación: functional/dedup.md
      - Cache: functional/cache.md
      - Projects: functional/projects.md
      - Monitorización de uso IA: functional/ai_usage_monitoring.md
      - Organización documental (dominios y contextos): functional/context.md
      - Configuración de IA y plantillas: functional/ai_settings.md
      - Acceso a la Aplicación: functional/access.md
      - Panel de Administración: functional/admin.md
  - API:
      - Descripción general: api/index.md
      - API pública y compatibilidad: api/publica.md
      - Validadores: api/validators.md
      - Scanner: api/scanner.md
      - Converter: api/converter.md
      - Deduplicación: api/dedup.md
      - Cache: api/cache.md
      - Projects: api/projects.md
      - Monitorización de uso IA: api/ai_usage_monitoring.md
      - Organización documental (dominios y contextos): api/context.md
  - Ejemplos:
      - Validadores: examples/validators-scan.md
      - Scanner: examples/scanner-scan.md
      - Converter: examples/converter-convert.md
      - Deduplicación: examples/dedup-resolve.md
      - Cache: examples/cache-changes.md
      - Projects: examples/projects-registry.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
